# Production overlay: `docker compose -f docker-compose.yml -f docker-compose.production.yml up -d`.
#
# The base file publishes every service on all host interfaces for development. On a server that
# exposes Postgres, Redis, MinIO (and its console) and ClamAV to the office network. This overlay
# publishes nothing but the app itself, and that only on loopback, for the reverse proxy to reach.
# Containers still reach each other over the compose network; none of them use the host ports.
#
# `!reset` and `!override` need Docker Compose v2.24.4 or later (and Docker Engine 28+ for the loopback binding to hold on the local network): a plain `ports:` here would be
# appended to the base file's list, not replace it.
#
# It also sets the restart policy. The base file has none, which is right for a laptop, but on a
# server a crashed container or a rebooted host must bring the stack back without an operator.
# `unless-stopped` restarts after a crash and when the Docker daemon starts, yet leaves alone a
# service someone stopped on purpose. `migrate` is deliberately absent: it is a one-shot gate that
# keeps `restart: 'no'` in the base file, and `api` re-waits for it on every `up`.
services:
  postgres:
    ports: !reset []
    restart: unless-stopped
  redis:
    ports: !reset []
    restart: unless-stopped
  minio:
    ports: !reset []
    restart: unless-stopped
  clamav:
    ports: !reset []
    restart: unless-stopped
  api:
    ports: !override
      - '127.0.0.1:${API_HOST_PORT:-4001}:4000'
    restart: unless-stopped
  worker:
    restart: unless-stopped
  web:
    ports: !override
      - '127.0.0.1:${WEB_HOST_PORT:-3001}:3000'
    restart: unless-stopped
