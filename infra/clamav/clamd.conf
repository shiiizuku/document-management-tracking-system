# clamd configuration — policy register P-07 (scanner failure posture).
#
# The image's defaults scan archives but report OK for anything they decline to scan in full:
# AlertExceedsMax is off by default, so content past a limit comes back indistinguishable from
# content that was scanned and found harmless. D-80 requires the opposite — an indeterminate
# result is quarantined fail-closed — so the limits are pinned here and exceeding one is raised
# as a detection rather than swallowed.
#
# This matters because .docx and .xlsx are ZIP containers: every Office upload takes the archive
# path, so the gap is reachable in ordinary use, not only by a crafted file.

TCPSocket 3310
# No TCPAddr: clamd then listens on every address, IPv6 included. Pinning 0.0.0.0 left the
# image's healthcheck, which pings `localhost` and resolves to ::1, failing forever.
# The local socket is what the image's entrypoint waits for and what freshclam notifies after a
# definitions update; without it the entrypoint loops and freshclam's reload never lands.
LocalSocket /tmp/clamd.sock
Foreground yes

# Exceeding any limit below is reported as a detection. With this off, a file that could not be
# fully inspected passes the gate as clean, which is the behaviour D-80 forbids.
AlertExceedsMax yes

ScanArchive yes

# Sized against the 25 MiB upload ceiling (UPLOAD_MAX_BYTES), not against the image defaults of
# 400 MiB / 100 MiB. An upload cannot exceed 25 MiB, so a decompressed total above 200 MiB means
# a compression ratio no legitimate document carries — exactly the case to refuse rather than
# spend the scanner's budget on.
MaxScanSize 200M
MaxFileSize 25M

# Depth and entry count bound the work one upload can cause. A real .docx holds tens of entries
# and nests two or three levels; these leave generous headroom while ruling out an archive bomb
# being used to exhaust the scanner.
MaxRecursion 8
MaxFiles 2000
