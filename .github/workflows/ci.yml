name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    name: lint · typecheck · unit · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `@dts/contracts` is consumed through its built `dist/`, which is gitignored.
      # Without this, every `@dts/contracts` import resolves to the error type on a
      # clean checkout and type-aware lint/typecheck fail with ~50 phantom errors.
      # It must run before lint, not as part of the final `npm run build`.
      - run: npm run build -w @dts/contracts
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: docker compose config --quiet

  # The infrastructure comes from docker-compose.yml, started in a step rather than declared as
  # `services:`. Two of them cannot be service containers at all: clamav needs
  # `infra/clamav/clamd.conf` bind-mounted and service containers start *before* the repository is
  # checked out, so the mount has nothing to resolve to; and MinIO has no image to pull (AIStor is
  # license-gated, the community image is gone), so it is built from the vendored AGPL source in
  # ./minio. Using compose also means CI runs against the same definitions a developer runs.
  integration:
    name: integration (postgres · redis · minio · clamav)
    runs-on: ubuntu-latest
    env:
      # Compose reads these, so the stack and the suites agree by construction. The database name
      # is not the compose default: the migration and files suites drop and recreate `public`, and
      # the guard below plus a dedicated name keep that away from anything else.
      POSTGRES_DB: dts_test
      DATABASE_URL: postgresql://dts:dts@localhost:5433/dts_test
      # The outbox → notification pipeline is exercised against a real Redis.
      REDIS_URL: redis://localhost:6380
      # Attachment bytes go to the real bucket (no in-memory adapter), so these have to be the
      # credentials MinIO is started with. `setup-int-env.ts` deliberately defaults none of them.
      MINIO_ENDPOINT: http://localhost:9002
      MINIO_ACCESS_KEY: dts-local
      MINIO_SECRET_KEY: dts-local1
      MINIO_BUCKET: dts-files
      CLAMAV_HOST: localhost
      CLAMAV_PORT: '3311'
      # The migration suite drops and recreates `public`; the guard makes that
      # impossible to run against a database that has not opted in.
      ALLOW_DATABASE_RESET: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Same reason as the quality job: the API imports `@dts/contracts` at runtime
      # through `dist/`, so the suites cannot even load without it.
      - run: npm run build -w @dts/contracts

      # Postgres archives WAL into this path (compose BACKUP_PATH). It is gitignored, so on a clean
      # checkout the subdirectories do not exist and every archive_command would fail.
      - run: mkdir -p backups/wal backups/base backups/objects

      # Building MinIO from source is minutes of Go compilation that changes only when the
      # vendored source does, so the built image is cached as a tarball rather than rebuilt per
      # run. `docker compose up` builds only when the image is absent, so a cache hit skips it.
      - name: Restore the MinIO image built from vendored source
        id: minio-image
        uses: actions/cache@v4
        with:
          path: /tmp/dts-minio-image.tar
          key: dts-minio-${{ hashFiles('minio/go.sum', 'minio/go.mod', 'minio/Dockerfile.fromsource') }}
      - if: steps.minio-image.outputs.cache-hit == 'true'
        run: docker load -i /tmp/dts-minio-image.tar
      - if: steps.minio-image.outputs.cache-hit != 'true'
        run: |
          docker compose build minio
          docker save dts-minio:from-source -o /tmp/dts-minio-image.tar

      # ClamAV's definitions are baked into the image and freshclam tops them up at startup, which
      # is most of the wait here — hence the timeout well above the 90s health start period. The
      # definitions are deliberately not cached: a stale signature database is the one thing that
      # would make a fail-closed scanner test pass for the wrong reason.
      - name: Start the infrastructure
        run: docker compose up -d --wait --wait-timeout 420 postgres redis minio clamav
      - if: failure()
        run: docker compose logs --tail 100 clamav minio

      - run: npm run test:integration -w @dts/api
      - if: always()
        run: docker compose down -v

  # The end-to-end and accessibility suites (Wave C of docs/phase-7-sequencing.md). Same split as
  # the integration job: the infrastructure comes from compose in a step, and the application runs
  # as plain Node processes — started, probed and torn down by Playwright's `webServer`. Putting the
  # api/worker/web into compose instead would mean building two more images per run for no extra
  # fidelity, and would lose the server logs `webServer` prints when one fails to come up.
  #
  # It is a job of its own rather than more steps on `integration`: both want the whole stack, but
  # this one also wants a build and a browser, and a failure in one should not hide the other.
  e2e:
    name: e2e · axe (playwright)
    runs-on: ubuntu-latest
    env:
      # A database of its own, created by the suite's global setup from the `postgres` maintenance
      # database — so compose's own POSTGRES_DB is left at its default and is never touched. The
      # name has to contain "e2e" or "test": `fixtures/database.ts` refuses to drop a schema in
      # anything else, because the seed is destructive.
      DATABASE_URL: postgresql://dts:dts@localhost:5433/dts_e2e
      ALLOW_DATABASE_RESET: 'true'
      REDIS_URL: redis://localhost:6380
      # As with the integration job: these have to be the credentials MinIO is actually started
      # with, and the harness deliberately defaults none of them.
      MINIO_ENDPOINT: http://localhost:9002
      MINIO_ACCESS_KEY: dts-local
      MINIO_SECRET_KEY: dts-local1
      MINIO_BUCKET: dts-files
      CLAMAV_HOST: localhost
      CLAMAV_PORT: '3311'
      SESSION_SECRET: end-to-end-session-secret-at-least-32-characters
      COOKIE_SECURE: 'false'
      COOKIE_SAME_SITE: lax
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Everything else resolves `@dts/contracts` through its gitignored `dist/`, so this comes
      # first here exactly as it does in the other two jobs.
      - run: npm run build -w @dts/contracts

      # Postgres archives WAL into this path (compose BACKUP_PATH), and the directories are
      # gitignored, so every archive_command would fail on a clean checkout without them.
      - run: mkdir -p backups/wal backups/base backups/objects

      # The same cache key as the integration job, so whichever job runs second gets a hit.
      - name: Restore the MinIO image built from vendored source
        id: minio-image
        uses: actions/cache@v4
        with:
          path: /tmp/dts-minio-image.tar
          key: dts-minio-${{ hashFiles('minio/go.sum', 'minio/go.mod', 'minio/Dockerfile.fromsource') }}
      - if: steps.minio-image.outputs.cache-hit == 'true'
        run: docker load -i /tmp/dts-minio-image.tar
      - if: steps.minio-image.outputs.cache-hit != 'true'
        run: |
          docker compose build minio
          docker save dts-minio:from-source -o /tmp/dts-minio-image.tar

      - name: Start the infrastructure
        run: docker compose up -d --wait --wait-timeout 420 postgres redis minio clamav
      - if: failure()
        run: docker compose logs --tail 100 clamav minio

      # The suites run the built artefacts, not `tsx` or `next dev`: the point is to exercise what
      # ships. `global-setup.ts` refuses to start without them.
      - run: npm run build

      # Chromium only. The browser matrix is a separate box; one engine is what C4 needs and it
      # keeps the download to one browser rather than three.
      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e -w @dts/e2e

      # The report carries the axe findings for every screen, including the `serious` ones the
      # sweep records without failing on, plus a trace for anything that broke.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          retention-days: 14
      - if: always()
        run: docker compose down -v
