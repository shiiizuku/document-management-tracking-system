name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    name: lint · typecheck · unit · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `@dts/contracts` is consumed through its built `dist/`, which is gitignored.
      # Without this, every `@dts/contracts` import resolves to the error type on a
      # clean checkout and type-aware lint/typecheck fail with ~50 phantom errors.
      # It must run before lint, not as part of the final `npm run build`.
      - run: npm run build -w @dts/contracts
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: docker compose config --quiet

  integration:
    name: integration (postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dts_test
          POSTGRES_USER: dts
          POSTGRES_PASSWORD: dts
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dts -d dts_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://dts:dts@localhost:5432/dts_test
      # The outbox → notification pipeline is exercised against a real Redis.
      REDIS_URL: redis://localhost:6379
      # The migration suite drops and recreates `public`; the guard makes that
      # impossible to run against a database that has not opted in.
      ALLOW_DATABASE_RESET: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Same reason as the quality job: the API imports `@dts/contracts` at runtime
      # through `dist/`, so the suites cannot even load without it.
      - run: npm run build -w @dts/contracts
      - run: npm run test:integration -w @dts/api
