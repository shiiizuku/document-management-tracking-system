name: dts
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dts}
      POSTGRES_USER: ${POSTGRES_USER:-dts}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dts}
    ports: ['${POSTGRES_HOST_PORT:-5432}:5432']
    volumes: ['postgres_data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-dts} -d ${POSTGRES_DB:-dts}']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports: ['${REDIS_HOST_PORT:-6379}:6379']
    volumes: ['redis_data:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    # Free AGPLv3 MinIO compiled from source (./minio, RELEASE.2025-10-15T17-29-55Z).
    # The published quay.io/minio/aistor image is license-gated and denies all S3
    # operations offline; the community minio/minio image no longer exists. This
    # builds the server from the vendored AGPL source, so `docker compose up --build`
    # produces it automatically — no external MinIO image is pulled.
    build:
      context: ./minio
      dockerfile: Dockerfile.fromsource
    image: dts-minio:from-source
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-dts-local}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-dts-local1}
    ports: ['${MINIO_HOST_PORT:-9000}:9000', '${MINIO_CONSOLE_HOST_PORT:-9001}:9001']
    volumes: ['minio_data:/data']
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:9000/minio/health/live || exit 1']
      interval: 10s
      timeout: 5s
      retries: 20

  clamav:
    image: clamav/clamav:stable
    ports: ['${CLAMAV_HOST_PORT:-3310}:3310']
    volumes: ['clamav_data:/var/lib/clamav']
    healthcheck:
      test: ['CMD', '/usr/local/bin/clamdcheck.sh']
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 90s

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: npm run db:migrate -w @dts/api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dts}:${POSTGRES_PASSWORD:-dts}@postgres:5432/${POSTGRES_DB:-dts}
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: development
      PORT: 4000
      WEB_ORIGIN: http://localhost:${WEB_HOST_PORT:-3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-dts}:${POSTGRES_PASSWORD:-dts}@postgres:5432/${POSTGRES_DB:-dts}
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-dts-local}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-dts-local1}
      MINIO_BUCKET: dts-files
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      SESSION_SECRET: ${SESSION_SECRET:-local-development-session-secret-change-before-pilot}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-26214400}
    ports: ['${API_HOST_PORT:-4000}:4000']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      clamav: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:4000/api/v1/health/ready']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: node apps/api/dist/worker.js
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-dts}:${POSTGRES_PASSWORD:-dts}@postgres:5432/${POSTGRES_DB:-dts}
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-dts-local}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-dts-local1}
      MINIO_BUCKET: dts-files
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      SESSION_SECRET: ${SESSION_SECRET:-local-development-session-secret-change-before-pilot}
      WORKER_HEALTH_PORT: 4001
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-26214400}
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:4001/ready']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${API_HOST_PORT:-4000}/api/v1
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${API_HOST_PORT:-4000}/api/v1
    ports: ['${WEB_HOST_PORT:-3000}:3000']
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  postgres_data:
  redis_data:
  minio_data:
  clamav_data:
