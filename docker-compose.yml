# Every port published to the host is offset from its service's usual one (Postgres 5433 not 5432,
# Redis 6380, MinIO 9002/9003, ClamAV 3311, the API 4001, the web app 3001) so this stack can run
# beside another project on the same machine without a fight over a port. Inside the compose
# network the services still talk on their standard ports, so only the left-hand side moves.
#
# Each is overridable through the `*_HOST_PORT` variables below. `.env.example` points the
# host-run dev servers (`npm run dev`) at these same published ports.
name: dts
services:
  postgres:
    image: postgres:16-alpine
    # Continuous WAL archiving (policy register P-13, recovery point <= 5 minutes).
    #
    # `archive_timeout=60` closes the current segment once a minute even when it is not full,
    # which is what bounds data loss on a quiet system: without it a low-traffic afternoon can
    # leave the last committed transactions sitting in an unarchived segment indefinitely. The
    # cost is a mostly-empty 16 MB segment per minute of activity, which the archive prunes.
    #
    # `archive_command` refuses to overwrite (`test ! -f`), so a misconfigured restore that
    # replays into a live archive fails loudly rather than corrupting the history it is reading.
    # It creates `wal/` itself: on a fresh archive nothing else does until the first
    # `scripts/backup.sh`, and until then every segment fails to archive (D3 rehearsal).
    command: >
      postgres
      -c wal_level=replica
      -c archive_mode=on
      -c archive_timeout=60
      -c archive_command='mkdir -p /archive/wal && test ! -f /archive/wal/%f && cp %p /archive/wal/%f'
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dts}
      POSTGRES_USER: ${POSTGRES_USER:-dts}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dts}
    ports: ['${POSTGRES_HOST_PORT:-5433}:5432']
    volumes:
      - 'postgres_data:/var/lib/postgresql/data'
      # BACKUP_PATH must resolve to storage on a DIFFERENT machine (a NAS or second host
      # mount). An archive on this host dies with the host, and the host is the failure this
      # exists for — see docs/runbooks/backup-restore.md.
      - '${BACKUP_PATH:-./backups}:/archive'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-dts} -d ${POSTGRES_DB:-dts}']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports: ['${REDIS_HOST_PORT:-6380}:6379']
    volumes: ['redis_data:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    # Free AGPLv3 MinIO compiled from source (./minio, RELEASE.2025-10-15T17-29-55Z).
    # The published quay.io/minio/aistor image is license-gated and denies all S3
    # operations offline; the community minio/minio image no longer exists. This
    # builds the server from the vendored AGPL source, so `docker compose up --build`
    # produces it automatically — no external MinIO image is pulled.
    build:
      context: ./minio
      dockerfile: Dockerfile.fromsource
    image: dts-minio:from-source
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-dts-local}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-dts-local1}
    ports: ['${MINIO_HOST_PORT:-9002}:9000', '${MINIO_CONSOLE_HOST_PORT:-9003}:9001']
    volumes:
      - 'minio_data:/data'
      # The same off-host archive Postgres writes WAL to, so one destination holds both halves
      # of a recoverable state and a restore reads from one place.
      - '${BACKUP_PATH:-./backups}:/archive'
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:9000/minio/health/live || exit 1']
      interval: 10s
      timeout: 5s
      retries: 20

  clamav:
    image: clamav/clamav:stable
    ports: ['${CLAMAV_HOST_PORT:-3311}:3310']
    volumes:
      - 'clamav_data:/var/lib/clamav'
      # Pins the archive-scan limits and turns on AlertExceedsMax, so an archive clamd declines
      # to scan in full is reported as a detection rather than as clean (policy register P-07).
      - './infra/clamav/clamd.conf:/etc/clamav/clamd.conf:ro'
    healthcheck:
      test: ['CMD', '/usr/local/bin/clamdcheck.sh']
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 90s

  # Applies migrations once against a live database, then exits; the api waits for it
  # to succeed. Runs the COMPILED migrator (`dist/`) because the runtime image carries
  # no `src/`, and from `working_dir` apps/api so the migrator's relative
  # `migrationsFolder: './drizzle'` resolves to the drizzle/ the image copies in.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    working_dir: /app/apps/api
    command: node dist/database/migrate.js
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dts}:${POSTGRES_PASSWORD:-dts}@postgres:5432/${POSTGRES_DB:-dts}
      # Read only by the seed, which is run in this image (README, Production stack).
      NODE_ENV: ${NODE_ENV:-development}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      # The Regional Director's account (ADR-0006). The seed refuses to run with
      # NODE_ENV=production unless both are set, rather than planting a development password.
      DIRECTOR_EMAIL: ${DIRECTOR_EMAIL:-}
      DIRECTOR_PASSWORD: ${DIRECTOR_PASSWORD:-}
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4000
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:${WEB_HOST_PORT:-3001}}
      # /api/docs: on outside production, off in it, unless this says otherwise.
      API_DOCS: ${API_DOCS:-}
      # The API refuses to boot with NODE_ENV=production unless this is true (HTTPS only).
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DATABASE_URL: postgresql://${POSTGRES_USER:-dts}:${POSTGRES_PASSWORD:-dts}@postgres:5432/${POSTGRES_DB:-dts}
      # Pool size per process; match the database host's cores (docs/d2-performance-fixes.md F4).
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      DATABASE_STATEMENT_TIMEOUT_MS: ${DATABASE_STATEMENT_TIMEOUT_MS:-10000}
      # Postgres JIT for the API's connections; off, because it costs more than it saves here.
      DATABASE_JIT: ${DATABASE_JIT:-false}
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-dts-local}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-dts-local1}
      MINIO_BUCKET: dts-files
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      SESSION_SECRET: ${SESSION_SECRET:-local-development-session-secret-change-before-pilot}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-26214400}
      # Off unless set: behind the pilot's TLS ingress this must name that hop, or every client
      # shares one rate-limit bucket (.env.example, docs/architecture.md §8).
      TRUST_PROXY: ${TRUST_PROXY:-}
      # Both processes validate the environment at boot, and with NODE_ENV=production both refuse
      # to start without a configured Regional Director (ADR-0006).
      DIRECTOR_EMAIL: ${DIRECTOR_EMAIL:-}
      DIRECTOR_PASSWORD: ${DIRECTOR_PASSWORD:-}
    ports: ['${API_HOST_PORT:-4001}:4000']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      clamav: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4000/api/v1/health/ready']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: node apps/api/dist/worker.js
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-dts}:${POSTGRES_PASSWORD:-dts}@postgres:5432/${POSTGRES_DB:-dts}
      # Pool size per process; match the database host's cores (docs/d2-performance-fixes.md F4).
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-dts-local}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-dts-local1}
      MINIO_BUCKET: dts-files
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      SESSION_SECRET: ${SESSION_SECRET:-local-development-session-secret-change-before-pilot}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      WORKER_HEALTH_PORT: 4001
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-26214400}
      # Both processes validate the environment at boot, and with NODE_ENV=production both refuse
      # to start without a configured Regional Director (ADR-0006).
      DIRECTOR_EMAIL: ${DIRECTOR_EMAIL:-}
      DIRECTOR_PASSWORD: ${DIRECTOR_PASSWORD:-}
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4001/ready']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Baked into the client bundle at build time: rebuild `web` after changing it.
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:${API_HOST_PORT:-4001}/api/v1}
    environment:
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:${API_HOST_PORT:-4001}/api/v1}
    ports: ['${WEB_HOST_PORT:-3001}:3000']
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  postgres_data:
  redis_data:
  minio_data:
  clamav_data:
